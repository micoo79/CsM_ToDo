<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CsM ToDo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/bold/rounded.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/regular/straight.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@flaticon/flaticon-uicons@3.3.1/css/solid/straight.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --c-primary: #025259;
      --c-primary-light: #007172;
      --c-accent: #F29325;
      --c-danger: #D94F04;
      --c-bg: #F4E2DE;
      --c-selection: #f5a623;
      --c-selection-text: #222222;
      --c-row-full: #d4edda;
      --c-row-full-text: #222222;
      --c-row-park: #e8e8e8;
      --c-row-park-text: #999999;
      --c-row-alert: #f8d7da;
      --c-row-alert-text: #222222;
      --c-chk-g1: #007172;
      --c-chk-g2: #F29325;
      --c-chk-g3: #025259;
      --c-chk-g4: #007172;
      --c-chk-g5: #D94F04;
      --c-chk-g6: #025259;
      --c-chk-mix: 50%;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      font-size: 13px;
      background: var(--c-bg);
      color: #222;
    }

    /* === LOGIN === */
    .login-screen {
      position: fixed; inset: 0;
      background: var(--c-bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999;
    }
    .login-box {
      background: #fff;
      border: 1px solid var(--c-primary-light);
      border-radius: 8px;
      padding: 32px 28px;
      width: 100%; max-width: 340px;
      box-shadow: 0 4px 20px rgba(2,82,89,.18);
    }
    .login-box h2 {
      font-size: 18px; font-weight: 700;
      text-align: center; margin-bottom: 6px;
      color: var(--c-primary);
    }
    .login-box .login-sub {
      text-align: center; color: #666; font-size: 12px; margin-bottom: 20px;
    }
    .login-box input {
      width: 100%; padding: 10px 12px; margin-bottom: 10px;
      background: #fff; border: 1px solid #ccc; border-radius: 4px;
      color: #222; font-size: 13px;
      outline: none;
    }
    .login-box input:focus { border-color: var(--c-primary-light); box-shadow: 0 0 0 2px rgba(0,113,114,.18); }
    .login-box button {
      width: 100%; padding: 10px; margin-top: 4px;
      background: var(--c-primary); border: none; border-radius: 4px;
      color: #fff; font-size: 13px; font-weight: 600;
      cursor: pointer;
    }
    .login-box button:hover { background: var(--c-primary-light); }
    .login-box button:disabled { opacity: .5; cursor: wait; }
    .login-error { color: var(--c-danger); font-size: 12px; margin-top: 10px; text-align: center; }

    /* === APP LAYOUT === */
    .app { display: none; height: 100vh; flex-direction: column; }

    /* Toolbar */
    .toolbar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      padding: 8px 16px;
      background: #fff;
      border-bottom: 1px solid #ddd;
      flex-shrink: 0;
    }
    .toolbar-actions { display: flex; gap: 4px; align-items: center; }
    .tbtn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 6px 10px; border-radius: 4px;
      font-size: 18px;
      background: none; border: none;
      color: var(--c-primary); cursor: pointer;
      transition: color .2s, transform .2s;
    }
    .tbtn:hover { color: var(--c-accent); transform: scale(1.2); }
    .tbtn:disabled { opacity: .35; cursor: not-allowed; transform: none; }
    .tbtn:disabled:hover { color: var(--c-primary); transform: none; }
    .toolbar-spacer { flex: 1; }
    .toolbar-filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-filters label { font-size: 16px; color: #555; }
    .toolbar-filters input[type="text"] {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 16px; width: 250px; outline: none;
    }
    .toolbar-filters input[type="text"]:focus { border-color: var(--c-primary-light); }
    .toolbar-filters select {
      padding: 6px 8px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 16px; outline: none; background: #fff;
    }
    .toolbar-filters input[type="checkbox"] { cursor: pointer; accent-color: var(--c-primary-light); }

    /* === TABLE === */
    .table-wrap {
      flex: 1;
      overflow: auto;
      background: #fff;
    }
    table {
      border-collapse: collapse;
      width: max-content;
      min-width: 100%;
    }
    thead { position: sticky; top: 0; z-index: 10; }
    thead th {
      background: var(--c-primary);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      padding: 6px 6px;
      text-align: center;
      white-space: nowrap;
      border: none;
      position: relative;
      user-select: none;
      vertical-align: bottom;
    }
    thead th.col-chk {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      height: 130px;
      vertical-align: bottom;
      line-height: 1;
      padding: 6px 4px;
    }
    thead th.col-text { text-align: center; }

    /* Year separator */
    .year-row td {
      background: var(--c-bg);
      font-weight: 700;
      font-size: 20px;
      padding: 8px 14px;
      color: var(--c-primary);
      border: 1px solid #d0c8c6;
    }

    /* Data rows */
    tbody td {
      padding: 5px 8px;
      border: 1px solid #e0dbd9;
      vertical-align: middle;
      white-space: nowrap;
    }
    tbody tr { transition: background .1s; }
    tbody tr:hover { background: #e0f0f0 !important; }
    /* Conditional row colors — only name cell */
    tbody tr.parkrow td.col-name { background: var(--c-row-park) !important; color: var(--c-row-park-text); }
    tbody tr.parkrow { color: var(--c-row-park-text); }
    tbody tr.fullrow td.col-name { background: var(--c-row-full) !important; color: var(--c-row-full-text); }
    tbody tr.alertrow td.col-name { background: var(--c-row-alert) !important; color: var(--c-row-alert-text); }
    /* Selected row — full row colored */
    tbody tr.selected td { background: var(--c-selection) !important; color: var(--c-selection-text); }
    tbody tr.selected td.col-gap { background: #fff !important; }
    tbody tr.hiddenrow { background: var(--c-bg); opacity: .6; }
    /* Vizsgálat alatt — green font, default bg, overrides everything */
    tbody tr td.col-name-vizsg { background: transparent !important; color: var(--c-row-full) !important; }
    tbody tr.selected td.col-name-vizsg { background: var(--c-selection) !important; color: var(--c-row-full) !important; }

    /* Checkbox cells */
    td.chk {
      text-align: center;
      padding: 2px;
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      line-height: 1;
    }
    td.chk input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 20px; height: 20px;
      margin: 0 auto;
      padding: 0;
      display: block;
      cursor: pointer;
      border: 2px solid #c5c0be;
      border-radius: 3px;
      background: #fff;
      position: relative;
    }
    td.chk input[type="checkbox"]:checked {
      background: var(--c-primary-light);
      border-color: var(--c-primary-light);
    }
    td.chk input[type="checkbox"]:checked::after {
      content: '\2713';
      position: absolute;
      color: #fff;
      font-size: 14px; font-weight: 700;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      line-height: 1;
    }
    /* Checkbox group header colors */
    th.chk-g1 { background: var(--c-chk-g1) !important; }
    th.chk-g2 { background: var(--c-chk-g2) !important; color: #fff; }
    th.chk-g3 { background: var(--c-chk-g3) !important; }
    th.chk-g4 { background: var(--c-chk-g4) !important; }
    th.chk-g5 { background: var(--c-chk-g5) !important; }
    th.chk-g6 { background: var(--c-chk-g6) !important; }
    /* Checkbox group cell backgrounds — header color mixed with white */
    td.chk-g1 { background: color-mix(in srgb, var(--c-chk-g1) var(--c-chk-mix), #fff); }
    td.chk-g2 { background: color-mix(in srgb, var(--c-chk-g2) var(--c-chk-mix), #fff); }
    td.chk-g3 { background: color-mix(in srgb, var(--c-chk-g3) var(--c-chk-mix), #fff); }
    td.chk-g4 { background: color-mix(in srgb, var(--c-chk-g4) var(--c-chk-mix), #fff); }
    td.chk-g5 { background: color-mix(in srgb, var(--c-chk-g5) var(--c-chk-mix), #fff); }
    td.chk-g6 { background: color-mix(in srgb, var(--c-chk-g6) var(--c-chk-mix), #fff); }
    /* Group-specific checkbox colors */
    td.chk-g1 input[type="checkbox"]:checked { background: var(--c-chk-g1); border-color: var(--c-chk-g1); }
    td.chk-g2 input[type="checkbox"]:checked { background: var(--c-chk-g2); border-color: var(--c-chk-g2); }
    td.chk-g3 input[type="checkbox"]:checked { background: var(--c-chk-g3); border-color: var(--c-chk-g3); }
    td.chk-g4 input[type="checkbox"]:checked { background: var(--c-chk-g4); border-color: var(--c-chk-g4); }
    td.chk-g5 input[type="checkbox"]:checked { background: var(--c-chk-g5); border-color: var(--c-chk-g5); }
    td.chk-g6 input[type="checkbox"]:checked { background: var(--c-chk-g6); border-color: var(--c-chk-g6); }
    /* Group gap spacer */
    th.col-gap, td.col-gap {
      width: 5px; min-width: 5px; max-width: 5px;
      background: #fff !important;
      border: none !important;
      padding: 0;
    }

    /* Text input cells */
    td .cell-input {
      width: 100%;
      border: none;
      outline: none;
      background: transparent;
      font-size: 18px;
      font-family: inherit;
      padding: 3px 3px;
      color: inherit;
      pointer-events: none;
    }
    /* In selected rows: show faint borders, allow click */
    tr.selected td .cell-input {
      border: 1px dashed rgba(0,0,0,0.18);
      border-radius: 3px;
      pointer-events: auto;
      cursor: text;
    }
    td .cell-input:focus {
      background: #fffbe6;
      border: 1px solid var(--c-selection) !important;
      border-radius: 2px;
    }
    td .cell-input.name-input {
      font-weight: 600;
      min-width: 160px;
    }
    td .cell-input.name-input.name-extrabold {
      font-weight: 900;
    }
    td .cell-input.num-input {
      text-align: right;
      min-width: 70px;
      font-variant-numeric: tabular-nums;
    }
    td .cell-input.note-input {
      min-width: 200px;
      font-size: 11px;
    }
    td .cell-input.mobil-input {
      min-width: 110px;
      font-size: 11px;
    }

    /* Column widths */
    .col-ho { width: 40px; text-align: center; }
    .col-name { min-width: 240px; }
    .col-num { width: 110px; text-align: right; }
    .col-chk { width: 30px; min-width: 30px; max-width: 30px; }
    .col-note { min-width: 300px; }
    .col-mobil { min-width: 170px; }
    /* Hide/show button — inherits base .tbtn styling */

    /* Kintlévőség counter */
    .kintlevoseg-label {
      display: inline-flex; align-items: center; gap: 20px;
      font-size: 16px; font-weight: 600;
      color: var(--c-primary);
      padding: 4px 10px;
      white-space: nowrap;
      flex-wrap: wrap;
    }
    .kintlevoseg-label .kl-title {
      font-weight: 700;
      font-size: 16px;
      color: var(--c-danger);
      margin-right: 2px;
    }
    .kintlevoseg-label .kl-year {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 6px;
      font-size: 15px;
    }
    .kintlevoseg-label .kl-year b {
      color: var(--c-primary);
    }

    /* Year multi-select */
    .year-filter { position: relative; }
    .year-btn {
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 4px;
      font-size: 16px; background: #fff; cursor: pointer;
      min-width: 110px; text-align: left;
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
    }
    .year-btn:hover { border-color: var(--c-primary-light); }
    .year-btn .arrow { font-size: 9px; color: #999; }
    .year-dropdown {
      display: none;
      position: absolute; top: 100%; left: 0;
      background: #fff; border: 1px solid var(--c-primary-light); border-radius: 4px;
      box-shadow: 0 4px 12px rgba(2,82,89,.15);
      z-index: 100; min-width: 100px;
      padding: 4px 0;
      margin-top: 2px;
    }
    .year-dropdown.open { display: block; }
    .year-dropdown label {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 12px; cursor: pointer;
      font-size: 16px; color: #222;
    }
    .year-dropdown label:hover { background: #e6f2f2; }
    .year-dropdown input[type="checkbox"] { accent-color: var(--c-primary-light); cursor: pointer; }

    /* Stats / Settings / Logout — all inherit base .tbtn */

    /* Stats modal + Settings modal shared overlay */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
      z-index: 300;
    }
    .modal-overlay.open { display: flex; }
    .stats-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.4);
      display: none; align-items: center; justify-content: center;
      z-index: 300;
    }
    .stats-overlay.open { display: flex; }
    .stats-modal {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
      width: 95%; max-width: 1200px;
      max-height: 80vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .stats-header, .settings-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: var(--c-primary);
      color: #fff;
      font-size: 15px; font-weight: 700;
    }
    .stats-close, .settings-close {
      background: none; border: none; color: #fff;
      font-size: 20px; cursor: pointer; line-height: 1;
      padding: 0 4px;
    }
    .stats-close:hover, .settings-close:hover { opacity: .7; }
    .stats-body {
      padding: 20px;
      overflow-y: auto;
    }
    .stats-year-block {
      margin-bottom: 20px;
    }
    .stats-year-block:last-child { margin-bottom: 0; }
    .stats-year-title {
      font-size: 14px; font-weight: 700;
      color: var(--c-primary);
      padding: 6px 0;
      border-bottom: 2px solid var(--c-primary-light);
      margin-bottom: 10px;
    }
    .stats-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .stats-table th {
      text-align: left;
      padding: 5px 8px;
      background: #eaf5f5;
      border: 1px solid #b8d8d8;
      font-weight: 600;
      color: var(--c-primary);
    }
    .stats-table td {
      padding: 5px 8px;
      border: 1px solid #e0dbd9;
    }
    .stats-table td.num {
      text-align: right;
      font-variant-numeric: tabular-nums;
      font-weight: 500;
    }
    .stats-table tr.total-row td {
      background: #e6f2f2;
      font-weight: 700;
      border-top: 2px solid var(--c-primary-light);
    }
    .stats-table tr.avg-row td {
      background: #fef3e2;
      font-weight: 600;
      font-style: italic;
    }
    .stats-table .proj-col {
      color: #aaa;
    }
    .stats-table thead .proj-col {
      color: #999;
    }
    .stats-grand {
      margin-top: 16px;
      padding: 12px 16px;
      background: #e6f2f2;
      border: 1px solid var(--c-primary-light);
      border-radius: 6px;
      font-size: 13px;
    }
    .stats-grand b { color: var(--c-primary); }

    /* Chart */
    .stats-chart-wrap {
      margin-bottom: 20px;
      padding: 12px;
      background: #faf8f7;
      border-radius: 6px;
      border: 1px solid #e0dbd9;
    }
    .stats-chart-title {
      font-size: 13px; font-weight: 700; color: var(--c-primary);
      margin-bottom: 8px; text-align: center;
    }
    .stats-chart-canvas {
      width: 100%; height: 260px;
      display: block;
    }

    /* Summary row */
    .summary-row td {
      background: #e6f2f2;
      font-weight: 700;
      font-size: 18px;
      padding: 8px 8px;
      border: 1px solid #b8d8d8;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 6px 16px; border-radius: 20px;
      background: var(--c-primary); color: #fff; font-size: 12px; font-weight: 500;
      box-shadow: 0 2px 12px rgba(2,82,89,.35);
      opacity: 0; pointer-events: none;
      transition: opacity .2s;
      z-index: 200;
    }
    .toast.show { opacity: 1; }

    /* Loading */
    .loading-msg {
      display: flex; align-items: center; justify-content: center;
      padding: 40px; color: #888; font-size: 13px; gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #ddd; border-top-color: var(--c-primary-light);
      border-radius: 50%; animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Settings modal */
    .settings-modal {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.25);
      width: 95%; max-width: 520px;
      max-height: 85vh;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .settings-body {
      padding: 20px;
      overflow-y: auto;
    }
    .settings-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-row label {
      flex: 1;
      font-size: 14px; font-weight: 500; color: #333;
    }
    .settings-row .color-swatch {
      width: 36px; height: 36px;
      border: 2px solid #ccc; border-radius: 6px;
      cursor: pointer; padding: 0;
      overflow: hidden;
    }
    .settings-row .color-swatch::-webkit-color-swatch-wrapper { padding: 0; }
    .settings-row .color-swatch::-webkit-color-swatch { border: none; }
    .settings-row .hex-val {
      width: 80px; font-family: monospace; font-size: 13px;
      padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px;
      text-transform: uppercase;
    }
    .settings-row .pct-slider {
      width: 120px; accent-color: var(--c-primary-light); cursor: pointer;
    }
    .settings-row .pct-val {
      font-family: monospace; font-size: 13px; font-weight: 600;
      min-width: 40px; text-align: right;
    }
    .settings-footer {
      display: flex; justify-content: flex-end; gap: 10px;
      padding: 12px 20px;
      border-top: 1px solid #eee;
    }
    .settings-footer button {
      padding: 8px 20px; border-radius: 4px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .settings-footer .btn-ok {
      background: var(--c-primary); border: none; color: #fff;
    }
    .settings-footer .btn-ok:hover { background: var(--c-primary-light); }
    .settings-footer .btn-cancel {
      background: #fff; border: 1px solid #ccc; color: #333;
    }
    .settings-footer .btn-cancel:hover { background: #f5f5f5; }
    .settings-footer .btn-reset {
      background: #fde8d8; border: 1px solid var(--c-danger); color: var(--c-danger); margin-right: auto;
    }
    .settings-footer .btn-reset:hover { background: #fcd5bb; }

    /* Drag & drop */
    tbody tr[draggable="true"] {
      cursor: grab;
    }
    tbody tr[draggable="true"]:active {
      cursor: grabbing;
    }
    tbody tr.drag-over-above {
      border-top: 3px solid var(--c-accent) !important;
    }
    tbody tr.drag-over-below {
      border-bottom: 3px solid var(--c-accent) !important;
    }
    tbody tr.dragging {
      opacity: 0.4;
      background: #f0f0f0 !important;
    }
    .col-drag {
      width: 28px; min-width: 28px; max-width: 28px;
      text-align: center;
      color: #bbb;
      font-size: 14px;
      cursor: grab;
      user-select: none;
      padding: 2px 4px !important;
    }
    .col-drag:active { cursor: grabbing; }
    .col-drag:hover { color: var(--c-primary); }
    thead th.col-drag-head {
      width: 28px; min-width: 28px; max-width: 28px;
      padding: 6px 2px;
    }

    /* Phone column (mobile only) */
    .col-phone { display: none; width: 32px; min-width: 32px; max-width: 32px; text-align: center; padding: 2px; }
    .col-phone a { color: #27ae60; font-size: 18px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
    .col-phone a:active { transform: scale(1.3); }
    thead th.col-phone-head { display: none; width: 32px; min-width: 32px; max-width: 32px; padding: 2px; }

    /* Email link column */
    .col-email { width: 34px; min-width: 34px; max-width: 34px; text-align: center; padding: 2px; position: relative; }
    .col-email a { color: var(--c-primary); font-size: 16px; text-decoration: none; }
    .col-email a:hover { color: var(--c-accent); }
    .col-email .email-empty { cursor: pointer; width: 100%; height: 100%; min-height: 22px; }

    /* Email popover */
    .email-popover {
      display: none; position: absolute; z-index: 1500;

    /* Responsive */

  <!-- LOGIN -->

      <form id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" required autocomplete="email" />
        <input type="password" id="loginPassword" placeholder="Jelszó" required autocomplete="current-password" />
        <button type="submit" id="loginBtn">Bejelentkezés</button>
        <div id="loginError" class="login-error"></div>
      </form>
    </div>
  </div>

  <!-- APP -->
  <div class="app" id="mainApp">
    <!-- Toolbar -->

        <button id="delRow" class="tbtn" title="Törlés" disabled><i class="fi fi-rs-trash"></i></button>
        <button id="hideRow" class="tbtn" title="Elrejtés / Megjelenítés" disabled><i class="fi fi-rs-crossed-eye"></i></button>
        <button id="statsBtn" class="tbtn" title="Statisztika"><i class="fi fi-rs-chart-histogram"></i></button>

      </div>
      <div class="toolbar-spacer"></div>
      <div class="toolbar-filters">
        <label>Év:</label>
        <div class="year-filter" id="yearFilter">
          <button type="button" class="year-btn" id="yearBtn">Mind <span class="arrow">&#9660;</span></button>
          <div class="year-dropdown" id="yearDropdown"></div>
        </div>
        <label>Rejtett:</label>
        <input id="showHidden" type="checkbox" autocomplete="off" />
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrap" id="tableWrap">
      <div class="loading-msg"><div class="spinner"></div> Betöltés...</div>
    </div>
  </div>

  <!-- Stats modal -->
  <div class="stats-overlay" id="statsOverlay">
    <div class="stats-modal">
      <div class="stats-header">
        <span>Bevétel statisztika</span>
        <button class="stats-close" id="statsClose">&times;</button>
      </div>
      <div class="stats-body" id="statsBody"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsOverlay">
    <div class="settings-modal">
      <div class="settings-header">
        <span>Szinek beallitasai</span>
        <button class="settings-close" id="settingsClose">&times;</button>
      </div>
      <div class="settings-body" id="settingsBody"></div>
      <div class="settings-footer">
        <button class="btn-reset" id="settingsReset">Alapertelmezett</button>
        <button class="btn-cancel" id="settingsCancel">Megse</button>
        <button class="btn-ok" id="settingsOk">OK</button>
      </div>
    </div>
  </div>

  <!-- Note modal (mobile double-tap) -->
  <div class="note-modal-overlay" id="noteOverlay">
    <div class="note-modal">
      <div class="note-modal-title" id="noteModalTitle"></div>
      <div class="note-modal-text" id="noteModalText"></div>
      <button class="note-modal-close" id="noteModalClose">Bezárás</button>
    </div>
  </div>

  <div class="toast" id="toast">Mentve</div>

<script>
  // === SUPABASE CONFIG ===
  const SUPABASE_URL = 'https://jkgtnngehhkmatevsymo.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprZ3RubmdlaGhrbWF0ZXZzeW1vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTA0NjMsImV4cCI6MjA4NTYyNjQ2M30.o6DbiL5ZN0CD-Obuftk_08Ii4t0uYWMqkJg5h5lt_vI';
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: {
      persistSession: true,
      storageKey: 'todo-auth',
      autoRefreshToken: true,
      detectSessionInUrl: false
    }
  });

  // === AUTH ===
  const loginScreen = document.getElementById('loginScreen');
  const mainApp = document.getElementById('mainApp');
  const loginForm = document.getElementById('loginForm');
  const loginEmail = document.getElementById('loginEmail');
  const loginPassword = document.getElementById('loginPassword');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');

  function showLogin() {
    loginScreen.style.display = 'flex';
    mainApp.style.display = 'none';
  }
  function showApp() {
    loginScreen.style.display = 'none';
    mainApp.style.display = 'flex';
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginBtn.disabled = true;
    loginBtn.textContent = 'Bejelentkezés...';
    loginError.textContent = '';
    const { data, error } = await db.auth.signInWithPassword({
      email: loginEmail.value,
      password: loginPassword.value
    });
    if (error) {
      loginError.textContent = 'Hibás email vagy jelszó';
      loginBtn.disabled = false;
      loginBtn.textContent = 'Bejelentkezés';
      return;
    }
    showApp();
    startApp();
  });

  logoutBtn.addEventListener('click', async () => {
    await db.auth.signOut();
    showLogin();
    rows = [];
  });

  (async function checkAuth() {
    const { data: { session } } = await db.auth.getSession();
    if (session) { showApp(); startApp(); }
    else { showLogin(); }
  })();

  // === HELPERS ===
  const nowIso = () => new Date().toISOString().slice(0,19).replace('T',' ');
  const uid = () => (crypto?.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2)+Date.now());

  function getMonth(r) {
    if (r.date) { const m = new Date(r.date).getMonth() + 1; return isNaN(m) ? null : m; }
    return r.month || null;
  }

  function fmtNum(n) {
    if (n === null || n === undefined || n === "") return "";
    const x = Number(n);
    if (!Number.isFinite(x)) return "";
    return x.toLocaleString('hu-HU');
  }
  function parseNum(s) {
    const t = String(s ?? "").trim();
    if (!t) return null;
    const cleaned = t.replace(/\s/g,'').replace(/,/g,'.');
    const x = Number(cleaned);
    return Number.isFinite(x) ? x : null;
  }

  function extractPhone(s) {
    if (!s) return null;
    const digits = s.replace(/[^\d+]/g, '');
    if (digits.replace(/\+/g, '').length >= 7) return digits;
    return null;
  }

  // Note modal (mobile double-tap)
  const noteOverlay = document.getElementById('noteOverlay');
  const noteModalTitle = document.getElementById('noteModalTitle');
  const noteModalText = document.getElementById('noteModalText');
  document.getElementById('noteModalClose').addEventListener('click', () => noteOverlay.classList.remove('open'));
  noteOverlay.addEventListener('click', (e) => { if (e.target === noteOverlay) noteOverlay.classList.remove('open'); });

  function showNoteModal(name, note) {
    noteModalTitle.textContent = name || 'Megjegyzés';
    noteModalText.textContent = note || '(nincs megjegyzés)';
    noteOverlay.classList.add('open');
  }

  // === SUPABASE DATA ===
  async function loadRowsFromSupabase() {
    try {
      const { data, error } = await db.from('jobs').select('*').order('sort_order', { ascending: true, nullsFirst: false }).order('date', { ascending: false });
      if (error) throw error;
      return data.map(r => ({ ...r, month: getMonth(r), full: r.is_full, kint: r.is_kint }));
    } catch(e) { console.error('Supabase load error:', e); return null; }
  }

  async function saveRowToSupabase(row) {
    try {
      const dbRow = { ...row, is_full: row.full ?? row.is_full ?? false, is_kint: row.kint ?? row.is_kint ?? false, updated_at: new Date().toISOString() };
      delete dbRow.full; delete dbRow.kint; delete dbRow.month;
      const { data, error } = await db.from('jobs').upsert(dbRow, { onConflict: 'id' }).select();
      if (error) throw error;
      return data?.[0];
    } catch(e) { console.error('Supabase save error:', e); return null; }
  }

  async function deleteRowFromSupabase(id) {
    try {
      const { error } = await db.from('jobs').delete().eq('id', id);
      if (error) throw error;
      return true;
    } catch(e) { console.error('Supabase delete error:', e); return false; }
  }

  let _dirtyRows = new Set();
  function scheduleSave(row) {
    if (row?.id) _dirtyRows.add(row.id);
    clearTimeout(scheduleSave._t);
    scheduleSave._t = setTimeout(async () => {
      for (const id of _dirtyRows) {
        const r = rows.find(x => x.id === id);
        if (r) await saveRowToSupabase(r);
      }
      _dirtyRows.clear();
    }, 500);
  }

  // === DRAG & DROP STATE ===
  let _dragId = null;

  function reorderRow(fromId, toId, insertBefore) {
    const fromIdx = rows.findIndex(r => r.id === fromId);
    const toIdx = rows.findIndex(r => r.id === toId);
    if (fromIdx < 0 || toIdx < 0) return;
    const [moved] = rows.splice(fromIdx, 1);
    let newIdx = rows.findIndex(r => r.id === toId);
    if (!insertBefore) newIdx++;
    rows.splice(newIdx, 0, moved);
    // Recalc sort_order for all rows
    recalcSortOrder();
    render();
    quickToast('Sorrend mentve');
  }

  function recalcSortOrder() {
    for (let i = 0; i < rows.length; i++) {
      rows[i].sort_order = i;
    }
    // Batch save sort_order for all rows
    saveSortOrderBatch();
  }

  let _sortSaveTimer = null;
  function saveSortOrderBatch() {
    clearTimeout(_sortSaveTimer);
    _sortSaveTimer = setTimeout(async () => {
      try {
        // Save in chunks of 50
        for (let i = 0; i < rows.length; i += 50) {
          const batch = rows.slice(i, i + 50).map(r => ({
            id: r.id,
            sort_order: r.sort_order,
            updated_at: new Date().toISOString()
          }));
          await db.from('jobs').upsert(batch, { onConflict: 'id' });
        }
      } catch(e) { console.error('Sort order save error:', e); }
    }, 300);
  }

  // === STATE ===
  let rows = [];
  let selectedId = null;

  const tableWrap = document.getElementById('tableWrap');
  const qEl = document.getElementById('q');
  const monthEl = document.getElementById('month');
  const showHiddenEl = document.getElementById('showHidden');
  // Year multi-select
  const yearBtn = document.getElementById('yearBtn');
  const yearDropdown = document.getElementById('yearDropdown');
  let selectedYears = new Set(); // empty = all

  async function loadYearFilterFromDb() {
    try {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;
      const { data, error } = await db.from('user_settings').select('selected_years').eq('user_id', user.id).single();
      if (error || !data?.selected_years) return;
      data.selected_years.forEach(y => selectedYears.add(String(y)));
    } catch(_) {}
  }

  async function persistYearFilter() {
    try {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;
      await db.from('user_settings').upsert({
        user_id: user.id,
        selected_years: [...selectedYears]
      }, { onConflict: 'user_id' });
    } catch(_) {}
  }

  const btnAdd = document.getElementById('addRow');
  const btnDel = document.getElementById('delRow');
  const btnHide = document.getElementById('hideRow');
  const toast = document.getElementById('toast');

  function quickToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(quickToast._t);
    quickToast._t = setTimeout(() => toast.classList.remove('show'), 650);
  }

  // === CHECKBOX COLUMNS ===
  const CHK_COLS = [
    { key: 'offer_sent',  label: 'Ajánlat',   group: 'g1', mobHide: true },
    { key: 'accepted',    label: 'Elfogadva',  group: 'g1' },
    { key: 'paid',        label: 'Fizetve',    group: 'g1' },
    { key: 'terep',       label: 'Terep',      group: 'g2', mobHide: true },
    { key: 'ferc',        label: 'Férc',       group: 'g2', mobHide: true },
    { key: 'igenyelve',   label: 'igényelve',  group: 'g3' },
    { key: 'utalva',      label: 'utalva',     group: 'g3' },
    { key: 'kiadva',      label: 'kiadva',     group: 'g3' },
    { key: 'beadva',      label: 'Beadva',     group: 'g4', mobHide: true },
    { key: 'email_chk',   label: 'email',      group: 'g4', mobHide: true },
    { key: 'utalas_chk',  label: 'Utalás',     group: 'g4', mobHide: true },
    { key: 'vizsgalat_alatt', label: 'Vizsgálat alatt', group: 'g2', mobHide: true },
    { key: 'full',        label: 'FULL', saveKey: 'is_full', group: 'g5', mobHide: true },
    { key: 'parkolo',     label: 'parkoló',    group: 'g6', mobHide: true },
  ];

  const EXTRA_CHK = [
    { key: 'feltoltes',   label: 'feltöltés' },
    { key: 'szamla_ment', label: 'számla ment', mobHide: true },
    { key: 'szamlas',     label: 'Számlás', mobHide: true },
  ];

  // === FILTERS ===
  [qEl, monthEl, showHiddenEl].forEach(el => {
    if (!el) return;
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });

  // Year dropdown toggle
  yearBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    yearDropdown.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#yearFilter')) yearDropdown.classList.remove('open');
  });

  function updateYearBtnLabel() {
    if (selectedYears.size === 0) {
      yearBtn.innerHTML = 'Mind <span class="arrow">&#9660;</span>';
    } else {
      const yrs = Array.from(selectedYears).sort((a,b) => b - a).join(', ');
      yearBtn.innerHTML = yrs + ' <span class="arrow">&#9660;</span>';
    }
  }

  function populateYearFilter() {
    const years = new Set();
    rows.forEach(r => { if (r.date) { const y = new Date(r.date).getFullYear(); if (y) years.add(y); } });
    const sorted = Array.from(years).sort((a,b) => b - a);
    yearDropdown.innerHTML = '';
    for (const y of sorted) {
      const lbl = document.createElement('label');
      const chk = document.createElement('input');
      chk.type = 'checkbox';
      chk.value = y;
      chk.checked = selectedYears.has(String(y));
      chk.addEventListener('change', () => {
        if (chk.checked) selectedYears.add(String(y));
        else selectedYears.delete(String(y));
        persistYearFilter();
        updateYearBtnLabel();
        render();
      });
      lbl.appendChild(chk);
      lbl.appendChild(document.createTextNode(' ' + y));
      yearDropdown.appendChild(lbl);
    }
  }

  function passesFilters(r) {
    const showHidden = !!showHiddenEl?.checked;
    if (!showHidden && r.hidden) return false;
    if (selectedYears.size > 0 && r.date) {
      const yr = String(new Date(r.date).getFullYear());
      if (!selectedYears.has(yr)) return false;
    }
    const m = monthEl?.value ? String(monthEl.value) : "";
    if (m && String(r.month ?? "") !== m) return false;
    const q = (qEl?.value || "").trim().toLowerCase();
    if (q) {
      const hay = [r.short_name ?? "", r.note ?? "", r.munkaszam ?? "", r.mobil ?? "", String(r.month ?? "")].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }

  // === RENDER TABLE ===
  function render() {
    const filtered = rows.filter(passesFilters);

    // Group by year
    const byYear = {};
    for (const r of filtered) {
      const yr = r.date ? new Date(r.date).getFullYear() : 'Egyéb';
      if (!byYear[yr]) byYear[yr] = [];
      byYear[yr].push(r);
    }
    // Sort years descending
    const sortedYears = Object.keys(byYear).sort((a,b) => {
      if (a === 'Egyéb') return 1;
      if (b === 'Egyéb') return -1;
      return Number(b) - Number(a);
    });

    // Build table
    const table = document.createElement('table');

    // Header
    const thead = document.createElement('thead');
    const hRow = document.createElement('tr');
    const headers = [
      { label: '', cls: 'col-phone-head', phoneCol: true },
      { label: '⠿', cls: 'col-drag-head' },
      { label: 'Hó', cls: 'col-ho', mobHide: true },
      { label: 'Rövid név', cls: 'col-name col-text' },
      { label: 'Munkadíj', cls: 'col-num' },
      { label: 'Költség', cls: 'col-num', mobHide: true },
    ];
    let lastGroup = null;
    CHK_COLS.forEach(c => {
      if (lastGroup && c.group !== lastGroup) {
        headers.push({ spacer: true, cls: 'col-gap', mobHide: true });
      }
      headers.push({ label: c.label, cls: 'col-chk chk-' + c.group, mobHide: c.mobHide });
      lastGroup = c.group;
    });
    headers.push({ label: 'Megjegyzés', cls: 'col-note col-text', mobHide: true });
    headers.push({ label: 'Mobil', cls: 'col-mobil col-text' });
    headers.push({ label: '✉', cls: 'col-email' });
    EXTRA_CHK.forEach(c => headers.push({ label: c.label, cls: 'col-chk', mobHide: c.mobHide }));

    for (const h of headers) {
      const th = document.createElement('th');
      if (h.spacer) {
        th.className = 'col-gap' + (h.mobHide ? ' mob-hide' : '');
      } else {
        th.textContent = h.label;
        th.className = (h.cls || '') + (h.mobHide ? ' mob-hide' : '');
      }
      hRow.appendChild(th);
    }
    thead.appendChild(hRow);
    table.appendChild(thead);

    // Body
    const tbody = document.createElement('tbody');

    const totalCols = headers.length;

    for (const yr of sortedYears) {
      // Year separator row (hide if current year)
      const currentYear = new Date().getFullYear();
      if (String(yr) !== String(currentYear)) {
        const yrRow = document.createElement('tr');
        yrRow.className = 'year-row';
        const yrTd = document.createElement('td');
        yrTd.colSpan = totalCols;
        yrTd.textContent = yr;
        yrRow.appendChild(yrTd);
        tbody.appendChild(yrRow);
      }

      // Sort rows within year by sort_order (fallback to month)
      const yearRows = byYear[yr].sort((a,b) => {
        const sa = a.sort_order ?? 999999;
        const sb = b.sort_order ?? 999999;
        if (sa !== sb) return sa - sb;
        return (a.month||0) - (b.month||0);
      });

      for (const r of yearRows) {
        const tr = document.createElement('tr');
        tr.dataset.id = r.id;

        // Row state - priority: parkrow < fullrow < alertrow
        if (r.parkolo && !r.full) tr.classList.add('parkrow');
        if (r.full) tr.classList.add('fullrow');
        if (r.email_chk && r.utalas_chk && !r.beadva) tr.classList.add('alertrow');
        if (r.hidden) tr.classList.add('hiddenrow');
        if (r.id === selectedId) tr.classList.add('selected');

        // === Phone (mobile only) ===
        const tdPhone = document.createElement('td');
        tdPhone.className = 'col-phone';
        const phoneNum = extractPhone(r.mobil);
        if (phoneNum) {
          const phoneLink = document.createElement('a');
          phoneLink.href = 'tel:' + phoneNum;
          phoneLink.innerHTML = '<i class="fi fi-ss-phone-call"></i>';
          tdPhone.appendChild(phoneLink);
        }
        tr.appendChild(tdPhone);

        // === Drag handle ===
        tr.draggable = false;
        const tdDrag = document.createElement('td');
        tdDrag.className = 'col-drag';
        tdDrag.textContent = '⠿';
        tdDrag.addEventListener('mousedown', () => { tr.draggable = true; });
        tdDrag.addEventListener('mouseup', () => { tr.draggable = false; });
        tr.addEventListener('dragstart', (e) => {
          if (!tr.draggable) { e.preventDefault(); return; }
          _dragId = r.id;
          tr.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', r.id);
        });
        tr.addEventListener('dragend', () => {
          tr.draggable = false;
          tr.classList.remove('dragging');
          document.querySelectorAll('.drag-over-above,.drag-over-below').forEach(el => el.classList.remove('drag-over-above','drag-over-below'));
          _dragId = null;
        });
        tr.addEventListener('dragover', (e) => {
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const rect = tr.getBoundingClientRect();
          const midY = rect.top + rect.height / 2;
          tr.classList.remove('drag-over-above', 'drag-over-below');
          if (e.clientY < midY) {
            tr.classList.add('drag-over-above');
          } else {
            tr.classList.add('drag-over-below');
          }
        });
        tr.addEventListener('dragleave', () => {

  function updateKintlevoseg() {
    const byYear = {};
    for (const r of rows) {
      if (r.paid || !r.accepted) continue;
      const yr = r.date ? new Date(r.date).getFullYear() : null;
      if (!yr) continue;
      if (!byYear[yr]) byYear[yr] = 0;
      byYear[yr] += (Number(r.fee) || 0) - (Number(r.cost) || 0);
    }
    const years = Object.keys(byYear).map(Number).filter(y => byYear[y] !== 0).sort((a, b) => b - a);
    if (years.length === 0) {
      kintlevosegEl.innerHTML = '';
      return;
    }
    let html = '<span class="kl-title">Kintlévőség:</span>';
    const showYear = years.length > 1;
    for (const yr of years) {
      html += showYear
        ? `<span class="kl-year">${yr}: <b>${byYear[yr].toLocaleString('hu-HU')} Ft</b></span>`
        : `<span class="kl-year"><b>${byYear[yr].toLocaleString('hu-HU')} Ft</b></span>`;
    }
    kintlevosegEl.innerHTML = html;
  }

  function renderStats() {
    // Only count rows where paid === true
    const paidRows = rows.filter(r => r.paid);

    // Conditional rows: offer_sent=true, accepted=true, paid=false
    const conditionalRows = rows.filter(r => r.offer_sent && r.accepted && !r.paid);

    // Group by year from live data
    const byYear = {};
    for (const r of paidRows) {
      const yr = r.date ? new Date(r.date).getFullYear() : null;
      if (!yr) continue;
      if (!byYear[yr]) byYear[yr] = [];
      byYear[yr].push(r);
    }

    // Group conditional rows by year
    const condByYear = {};
    for (const r of conditionalRows) {
      const yr = r.date ? new Date(r.date).getFullYear() : null;
      if (!yr) continue;
      if (!condByYear[yr]) condByYear[yr] = [];
      condByYear[yr].push(r);
    }

    // Merge historic years (only add years not already in live data)
    const allYears = new Set([...Object.keys(byYear), ...Object.keys(condByYear), ...Object.keys(historicData).map(String)]);
    const sortedYears = [...allYears].sort((a,b) => Number(b) - Number(a));

    const monthNames = ['','Jan','Feb','Már','Ápr','Máj','Jún','Júl','Aug','Sze','Okt','Nov','Dec'];
    let html = '';
    let grandTotal = 0;
    let grandCount = 0;
    const chartData = {}; // year -> total for chart
    const chartDataProj = {}; // year -> projected total for chart

    for (const yr of sortedYears) {
      const yrNum = Number(yr);
      const showProj = yrNum >= 2026;
      const hasLive = byYear[yr] && byYear[yr].length > 0;
      const hasCond = condByYear[yr] && condByYear[yr].length > 0;
      const hasHistoric = historicData[yrNum];

      // Build month data from live rows
      const byMonth = {};
      const condByMonth = {};
      if (hasLive) {
        for (const r of byYear[yr]) {
          const m = r.month || 0;
          if (!byMonth[m]) byMonth[m] = { count: 0, sum: 0 };
          byMonth[m].count++;
          byMonth[m].sum += (Number(r.fee) || 0) - (Number(r.cost) || 0);
        }
      }
      if (hasCond) {
        for (const r of condByYear[yr]) {
          const m = r.month || 0;
          if (!condByMonth[m]) condByMonth[m] = { count: 0, sum: 0 };
          condByMonth[m].count++;
          condByMonth[m].sum += (Number(r.fee) || 0) - (Number(r.cost) || 0);
        }
      }

      // Merge historic month data for years with no live data
      if (hasHistoric && !hasLive) {
        for (let m = 1; m <= 12; m++) {
          const val = historicData[yrNum][m] || 0;
          if (val > 0) {
            byMonth[m] = { count: 0, sum: val, historic: true };
          }
        }
      }

      const allMonths = new Set([...Object.keys(byMonth).map(Number), ...Object.keys(condByMonth).map(Number)]);
      const sortedMonths = [...allMonths].sort((a,b) => a - b);

      let yearTotal = 0;
      let yearCount = 0;
      let yearCondTotal = 0;
      let yearCondCount = 0;
      let monthRows = '';

      for (const m of sortedMonths) {
        const md = byMonth[m] || { count: 0, sum: 0 };
        const cd = condByMonth[m] || { count: 0, sum: 0 };
        yearTotal += md.sum;
        yearCount += md.count;
        yearCondTotal += cd.sum;
        yearCondCount += cd.count;
        const label = m >= 1 && m <= 12 ? monthNames[m] : 'Ismeretlen';
        const countLabel = md.historic ? '-' : `${md.count} db`;
        const projCell = showProj
          ? `<td class="num proj-col">${(md.sum + cd.sum).toLocaleString('hu-HU')} Ft</td>`
          : '';
        monthRows += `<tr>
          <td>${label}</td>
          <td class="num">${countLabel}</td>
          <td class="num">${md.sum.toLocaleString('hu-HU')} Ft</td>
          ${projCell}
        </tr>`;
      }

      const activeMonthCount = sortedMonths.length;
      const monthlyAvg = activeMonthCount > 0 ? Math.round(yearTotal / activeMonthCount) : 0;
      const projMonthlyAvg = activeMonthCount > 0 ? Math.round((yearTotal + yearCondTotal) / activeMonthCount) : 0;
      grandTotal += yearTotal;
      grandCount += yearCount;
      chartData[yrNum] = yearTotal;
      chartDataProj[yrNum] = showProj ? yearTotal + yearCondTotal : yearTotal;

      const yearTag = hasHistoric && !hasLive && !hasCond ? `${yr} <span style="font-size:0.7em;color:#888;">(archív)</span>` : yr;
      const countLabel = hasHistoric && !hasLive ? '-' : `${yearCount} db`;
      const projHeader = showProj ? '<th style="text-align:right" class="proj-col">Feltételes</th>' : '';
      const projTotalCell = showProj
        ? `<td class="num proj-col">${(yearTotal + yearCondTotal).toLocaleString('hu-HU')} Ft</td>`
        : '';
      const projAvgCell = showProj
        ? `<td class="num proj-col">${projMonthlyAvg.toLocaleString('hu-HU')} Ft</td>`
        : '';

      html += `<div class="stats-year-block">
        <div class="stats-year-title">${yearTag}</div>
        <table class="stats-table">
          <thead><tr><th>Hónap</th><th style="text-align:right">Rekordok</th><th style="text-align:right">Bevétel</th>${projHeader}</tr></thead>
          <tbody>
            ${monthRows}
            <tr class="total-row">
              <td>Összesen</td>
              <td class="num">${countLabel}</td>
              <td class="num">${yearTotal.toLocaleString('hu-HU')} Ft</td>
              ${projTotalCell}
            </tr>
            <tr class="avg-row">
              <td>Havi átlag</td>
              <td class="num">${activeMonthCount} hónap</td>
              <td class="num">${monthlyAvg.toLocaleString('hu-HU')} Ft</td>
              ${projAvgCell}
            </tr>
          </tbody>
        </table>
      </div>`;
    }

    if (sortedYears.length === 0) {
      html = '<p style="color:#888;text-align:center;padding:20px;">Nincs adat.</p>';
    } else {
      // Chart placeholder before tables
      const chartHtml = `<div class="stats-chart-wrap">
        <div class="stats-chart-title">Éves bevételek</div>
        <canvas class="stats-chart-canvas" id="revenueChart"></canvas>
      </div>`;
      html = chartHtml + html;

      html += `<div class="stats-grand">
        Összes bevétel (minden év): <b>${grandTotal.toLocaleString('hu-HU')} Ft</b>
      </div>`;
    }

    statsBody.innerHTML = html;

    // Store chart data for deferred drawing
    _lastChartData = null;
    if (sortedYears.length > 0) {
      const chartYears = Object.keys(chartData).map(Number).sort((a,b) => a - b);
      const chartValues = chartYears.map(yr => chartData[yr]);
      const chartProjValues = chartYears.map(yr => chartDataProj[yr]);
      _lastChartData = { labels: chartYears, values: chartValues, projValues: chartProjValues };
    }
  }

  let _lastChartData = null;
  function drawChartIfNeeded() {
    if (!_lastChartData) return;
    drawRevenueChart('revenueChart', _lastChartData.labels, _lastChartData.values, _lastChartData.projValues);
  }

  function drawRevenueChart(canvasId, labels, values, projValues) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    const W = rect.width;
    const H = rect.height;

    const padLeft = 70, padRight = 20, padTop = 16, padBottom = 36;
    const chartW = W - padLeft - padRight;
    const chartH = H - padTop - padBottom;

    const allVals = [...values, ...(projValues || [])];
    const maxVal = Math.max(...allVals, 0);
    const minVal = Math.min(...allVals, 0);
    const range = (maxVal - minVal) || 1;

    // Gridlines
    const gridSteps = 5;
    ctx.strokeStyle = '#d0d0d0';
    ctx.lineWidth = 0.5;
    ctx.fillStyle = '#666';
    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    for (let i = 0; i <= gridSteps; i++) {
      const val = minVal + (range * i / gridSteps);
      const y = padTop + chartH - (chartH * (val - minVal) / range);
      ctx.beginPath();
      ctx.moveTo(padLeft, y);
      ctx.lineTo(padLeft + chartW, y);
      ctx.stroke();
      ctx.fillText(Math.round(val).toLocaleString('hu-HU'), padLeft - 6, y);
    }

    // Zero line
    if (minVal < 0) {
      const zeroY = padTop + chartH - (chartH * (0 - minVal) / range);
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(padLeft, zeroY);
      ctx.lineTo(padLeft + chartW, zeroY);
      ctx.stroke();
    }

    // Bars
    const barCount = labels.length;
    const barGap = Math.max(6, chartW * 0.08 / barCount);
    const barW = Math.min(60, (chartW - barGap * (barCount + 1)) / barCount);
    const totalBarsW = barCount * barW + (barCount + 1) * barGap;
    const offsetX = padLeft + (chartW - totalBarsW) / 2;

    const zeroY = padTop + chartH - (chartH * (0 - minVal) / range);

    ctx.font = '11px -apple-system, sans-serif';
    ctx.textAlign = 'center';

    for (let i = 0; i < barCount; i++) {
      const x = offsetX + barGap * (i + 1) + barW * i;
      const val = values[i];
      const proj = projValues ? projValues[i] : val;
      const hasProj = proj > val;

      // Projected extension bar (light green, drawn first so actual bar overlaps bottom)
      if (hasProj) {
        const projY = padTop + chartH - (chartH * (proj - minVal) / range);
        const projTop = Math.min(projY, zeroY);
        const projH = Math.abs(projY - zeroY);
        ctx.fillStyle = 'rgba(0, 113, 114, 0.25)';
        ctx.beginPath();
        const rp = Math.min(4, barW / 4, projH / 2);
        if (projH > 0) {
          ctx.moveTo(x + rp, projTop);
          ctx.lineTo(x + barW - rp, projTop);
          ctx.quadraticCurveTo(x + barW, projTop, x + barW, projTop + rp);
          ctx.lineTo(x + barW, projTop + projH);
          ctx.lineTo(x, projTop + projH);
          ctx.lineTo(x, projTop + rp);
          ctx.quadraticCurveTo(x, projTop, x + rp, projTop);
        }
        ctx.fill();
      }

      // Actual bar (dark green)
      const valY = padTop + chartH - (chartH * (val - minVal) / range);
      const barTop = Math.min(valY, zeroY);
      const barH = Math.abs(valY - zeroY);
      const grad = ctx.createLinearGradient(x, barTop, x, barTop + barH);
      if (val >= 0) {
        grad.addColorStop(0, '#007172');
        grad.addColorStop(1, '#025259');
      } else {
        grad.addColorStop(0, '#F29325');
        grad.addColorStop(1, '#D94F04');
      }
      ctx.fillStyle = grad;
      ctx.beginPath();
      const radius = Math.min(4, barW / 4, barH / 2);
      if (barH > 0) {
        ctx.moveTo(x + radius, barTop);
        ctx.lineTo(x + barW - radius, barTop);
        ctx.quadraticCurveTo(x + barW, barTop, x + barW, barTop + radius);
        ctx.lineTo(x + barW, barTop + barH);
        ctx.lineTo(x, barTop + barH);
        ctx.lineTo(x, barTop + radius);
        ctx.quadraticCurveTo(x, barTop, x + radius, barTop);
      }
      ctx.fill();

      // Projected value label (gray, above the light green part)
      if (hasProj) {
        const projY2 = padTop + chartH - (chartH * (proj - minVal) / range);
        ctx.fillStyle = '#aaa';
        ctx.font = 'bold 10px -apple-system, sans-serif';
        ctx.fillText((proj / 1000000).toFixed(1) + 'M', x + barW / 2, projY2 - 18);
      }

      // Actual value on top
      ctx.fillStyle = '#333';
      ctx.font = 'bold 11px -apple-system, sans-serif';
      const valText = (val / 1000000).toFixed(1) + 'M';
      const labelY = val >= 0 ? barTop - 6 : barTop + barH + 14;
      ctx.fillText(valText, x + barW / 2, labelY);

      // Year label
      ctx.fillStyle = '#444';
      ctx.font = '12px -apple-system, sans-serif';
      ctx.fillText(String(labels[i]), x + barW / 2, H - padBottom + 18);
    }
  }

  // === COLOR SETTINGS ===
  const COLOR_DEFS = [
    { key: '--c-primary',         label: 'Fo szin (fejlec, gombok)',           def: '#025259' },
    { key: '--c-primary-light',   label: 'Masodlagos szin (kiemeles)',         def: '#007172' },
    { key: '--c-accent',          label: 'Akcentus (narancs)',                 def: '#F29325' },
    { key: '--c-danger',          label: 'Figyelmezteto (piros)',              def: '#D94F04' },
    { key: '--c-bg',              label: 'Hatter szin',                        def: '#F4E2DE' },
    { key: '--c-selection',       label: 'Kijeloles hatter',                   def: '#f5a623' },
    { key: '--c-selection-text',  label: 'Kijeloles betuszin',                 def: '#222222' },
    { key: '--c-row-full',        label: 'Full kiemeles hatter',               def: '#d4edda' },
    { key: '--c-row-full-text',   label: 'Full kiemeles betuszin',             def: '#222222' },
    { key: '--c-row-park',        label: 'Parkolo kiemeles hatter',            def: '#e8e8e8' },
    { key: '--c-row-park-text',   label: 'Parkolo kiemeles betuszin',          def: '#999999' },
    { key: '--c-row-alert',       label: 'Riasztas kiemeles hatter',           def: '#f8d7da' },
    { key: '--c-row-alert-text',  label: 'Riasztas kiemeles betuszin',         def: '#222222' },
    { key: '--c-chk-g1',         label: 'Pipa csoport 1 (Ajanlat)',           def: '#007172' },
    { key: '--c-chk-g2',         label: 'Pipa csoport 2 (Terep)',             def: '#F29325' },
    { key: '--c-chk-g3',         label: 'Pipa csoport 3 (Igenyelve)',         def: '#025259' },
    { key: '--c-chk-g4',         label: 'Pipa csoport 4 (Beadva)',            def: '#007172' },
    { key: '--c-chk-g5',         label: 'Pipa csoport 5 (Full)',              def: '#D94F04' },
    { key: '--c-chk-g6',         label: 'Pipa csoport 6 (Parkolo)',           def: '#025259' },
    { key: '--c-chk-mix',        label: 'Pipa cella szinerosseg (%)',          def: '50%', type: 'percent' },
  ];

  const STORAGE_KEY = 'csm-todo-colors';

  function applyColorMap(obj) {
    for (const d of COLOR_DEFS) {
      if (obj[d.key]) document.documentElement.style.setProperty(d.key, obj[d.key]);
    }
  }

  function loadColorsFromCache() {
    try {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) applyColorMap(JSON.parse(saved));
    } catch(_) {}
  }

  async function loadColorsFromDb() {
    try {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;
      const { data, error } = await db.from('user_settings').select('colors').eq('user_id', user.id).single();
      if (error || !data?.colors) return;
      applyColorMap(data.colors);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data.colors));
    } catch(_) {}
  }

  async function saveColors(colorMap) {
    // Apply immediately
    for (const [k, v] of Object.entries(colorMap)) {
      document.documentElement.style.setProperty(k, v);
    }
    // Cache locally
    localStorage.setItem(STORAGE_KEY, JSON.stringify(colorMap));
    // Persist to DB
    try {
      const { data: { user } } = await db.auth.getUser();
      if (!user) return;
      await db.from('user_settings').upsert({
        user_id: user.id,
        colors: colorMap
      }, { onConflict: 'user_id' });
    } catch(_) {}
  }

  function getCurrentColors() {
    const cs = getComputedStyle(document.documentElement);
    const m = {};
    for (const d of COLOR_DEFS) {
      m[d.key] = cs.getPropertyValue(d.key).trim() || d.def;
    }
    return m;
  }

  // Apply cached colors immediately (DB load happens in startApp)
  loadColorsFromCache();

  // Settings modal
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsOverlay = document.getElementById('settingsOverlay');
  const settingsClose = document.getElementById('settingsClose');
  const settingsBody = document.getElementById('settingsBody');
  const settingsOk = document.getElementById('settingsOk');
  const settingsCancel = document.getElementById('settingsCancel');
  const settingsReset = document.getElementById('settingsReset');

  let _tempColors = {};

  function openSettings() {
    _tempColors = getCurrentColors();
    let html = '';
    for (const d of COLOR_DEFS) {
      const val = _tempColors[d.key] || d.def;
      if (d.type === 'percent') {
        const num = parseInt(val) || 50;
        html += `<div class="settings-row" data-key="${d.key}" data-type="percent">
          <label>${d.label}</label>
          <input type="range" class="pct-slider" min="5" max="100" value="${num}" />
          <span class="pct-val">${num}%</span>
        </div>`;
      } else {
        html += `<div class="settings-row" data-key="${d.key}">
          <label>${d.label}</label>
          <input type="color" class="color-swatch" value="${val}" />
          <input type="text" class="hex-val" value="${val}" maxlength="7" />
        </div>`;
      }
    }
    settingsBody.innerHTML = html;

    // Wire up each row
    settingsBody.querySelectorAll('.settings-row').forEach(row => {
      const key = row.dataset.key;
      if (row.dataset.type === 'percent') {
        const slider = row.querySelector('.pct-slider');
        const lbl = row.querySelector('.pct-val');
        slider.addEventListener('input', () => {
          lbl.textContent = slider.value + '%';
          _tempColors[key] = slider.value + '%';
        });
      } else {
        const swatch = row.querySelector('.color-swatch');
        const hex = row.querySelector('.hex-val');
        swatch.addEventListener('input', () => {
          hex.value = swatch.value;
          _tempColors[key] = swatch.value;
        });
        hex.addEventListener('input', () => {
          const v = hex.value.trim();
          if (/^#[0-9a-fA-F]{6}$/.test(v)) {
            swatch.value = v;
            _tempColors[key] = v;
          }
        });
      }
    });

    settingsOverlay.classList.add('open');
  }

  function closeSettings() {
    settingsOverlay.classList.remove('open');
  }

  settingsBtn.addEventListener('click', openSettings);
  settingsClose.addEventListener('click', closeSettings);
  settingsCancel.addEventListener('click', closeSettings);
  settingsOverlay.addEventListener('click', (e) => {
    if (e.target === settingsOverlay) closeSettings();
  });

  settingsOk.addEventListener('click', async () => {
    await saveColors(_tempColors);
    closeSettings();
    quickToast('Szinek mentve');
  });

  settingsReset.addEventListener('click', async () => {
    const defaults = {};
    for (const d of COLOR_DEFS) defaults[d.key] = d.def;
    await saveColors(defaults);
    // Refresh swatches in modal
    settingsBody.querySelectorAll('.settings-row').forEach(row => {
      const key = row.dataset.key;
      const d = COLOR_DEFS.find(x => x.key === key);
      if (d) {
        if (d.type === 'percent') {
          row.querySelector('.pct-slider').value = parseInt(d.def) || 50;
          row.querySelector('.pct-val').textContent = d.def;
        } else {
          row.querySelector('.color-swatch').value = d.def;
          row.querySelector('.hex-val').value = d.def;
        }
        _tempColors[key] = d.def;
      }
    });
    quickToast('Alapertelmezett szinek visszaallitva');
  });

  // === START ===
  async function startApp() {
    tableWrap.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Betöltés...</div>';
    const [loaded] = await Promise.all([loadRowsFromSupabase(), loadYearFilterFromDb(), loadColorsFromDb()]);
    rows = (loaded && loaded.length) ? loaded : [];
    populateYearFilter();
    updateYearBtnLabel();
    render();
  }
</script>
</body>
</html>
